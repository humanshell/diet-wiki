site_name: Diet Wiki
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.collapse
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

# This tells MkDocs where your documentation lives
docs_dir: docs

# The Navigation structure is the backbone of your website's sidebar
nav:
  - Home: index.md
  - Log: log.md
  - Concepts:
    - Concepts: concepts/index.md
    - Anti-Inflammatory Environment: concepts/anti-inflammatory-environment.md
    - Anti-Thrombotic Environment: concepts/anti-thrombotic-environment.md
    - Blood Pressure Reduction: concepts/blood-pressure-reduction.md
    - Chronic Kidney Disease: concepts/chronic-kidney-disease.md
    - Dyslipidemia Management: concepts/dyslipidemia-management.md
    - Hypertension: concepts/hypertension.md
    - Lifestyle Modification: concepts/lifestyle-modification.md
    - Lipid-Lowering Therapy: concepts/lipid-lowering-therapy.md
    - Major Adverse Cardiovascular Events: concepts/major-adverse-cardiovascular-events.md
    - Plaque Regression: concepts/plaque-regression.md
    - Residual Risk Assessment: concepts/residual-risk-assessment.md
    - Risk Stratification: concepts/risk-stratification.md
    - Secondary Cardiovascular Prevention: concepts/secondary-cardiovascular-prevention.md
    - Sodium Reduction: concepts/sodium-reduction.md
    - Systemic Inflammation: concepts/systemic-inflammation.md
